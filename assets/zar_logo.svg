<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) 3D Icon">
  <defs>
    <!-- Realistic 3D Cylindrical Book Spines (Top: Emerald, Mid: Amber-Gold, Bot: Crimson-Coral) -->
    <linearGradient id="bookTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="10%"  stop-color="#34D399"/>
      <stop offset="28%"  stop-color="#10B981"/>
      <stop offset="72%"  stop-color="#059669"/>
      <stop offset="92%"  stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="bookMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D97706"/>
      <stop offset="10%"  stop-color="#FBBF24"/>
      <stop offset="28%"  stop-color="#F59E0B"/>
      <stop offset="72%"  stop-color="#D97706"/>
      <stop offset="92%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="bookBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E11D48"/>
      <stop offset="10%"  stop-color="#FB7185"/>
      <stop offset="28%"  stop-color="#F43F5E"/>
      <stop offset="72%"  stop-color="#E11D48"/>
      <stop offset="92%"  stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Left/Right Cylindrical Spine Wrap Shading -->
    <linearGradient id="cylWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="6%"   stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="16%"  stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="84%"  stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="94%"  stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Warm Gold Embossed Spine Label Strip (matches reference) -->
    <linearGradient id="goldStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="25%"  stop-color="#F59E0B"/>
      <stop offset="75%"  stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Dark Textured Zipper Tape -->
    <linearGradient id="zipTape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1E293B"/>
      <stop offset="18%"  stop-color="#334155"/>
      <stop offset="50%"  stop-color="#0F172A"/>
      <stop offset="82%"  stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Brushed Steel / Titanium Zipper Metal (no pure white) -->
    <linearGradient id="steelTooth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#64748B"/>
      <stop offset="35%"  stop-color="#E2E8F0"/>
      <stop offset="70%"  stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steelBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E2E8F0"/>
      <stop offset="25%"  stop-color="#CBD5E1"/>
      <stop offset="70%"  stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="bookShadow" x="-8%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="zipShadow" x="-25%" y="-6%" width="150%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.60"/>
    </filter>
  </defs>

  <g filter="url(#bookShadow)">
    <!-- ================= TOP BOOK (Emerald) ================= -->
    <rect x="10" y="22" width="236" height="70" rx="11" fill="url(#bookTop)"/>
    <rect x="10" y="22" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <!-- Dual Spine Hinge Grooves -->
    <line x1="52" y1="22" x2="52" y2="92" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="22" x2="54" y2="92" stroke="#6EE7B7" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="60" y1="22" x2="60" y2="92" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Left Spine Gold Strip -->
    <rect x="26" y="32" width="11" height="50" rx="2.5" fill="url(#goldStrip)"/>

    <!-- ================= MIDDLE BOOK (Amber-Gold) ================= -->
    <rect x="10" y="92" width="236" height="70" rx="11" fill="url(#bookMid)"/>
    <rect x="10" y="92" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <!-- Contact shadow from top book -->
    <rect x="10" y="92" width="236" height="3" fill="#000000" fill-opacity="0.35"/>
    <line x1="52" y1="92" x2="52" y2="162" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="92" x2="54" y2="162" stroke="#FEF08A" stroke-opacity="0.30" stroke-width="1.2"/>
    <line x1="60" y1="92" x2="60" y2="162" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="26" y="102" width="11" height="50" rx="2.5" fill="url(#goldStrip)"/>

    <!-- ================= BOTTOM BOOK (Coral-Crimson) ================= -->
    <rect x="10" y="162" width="236" height="70" rx="11" fill="url(#bookBot)"/>
    <rect x="10" y="162" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <!-- Contact shadow from middle book -->
    <rect x="10" y="162" width="236" height="3" fill="#000000" fill-opacity="0.35"/>
    <line x1="52" y1="162" x2="52" y2="232" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="162" x2="54" y2="232" stroke="#FDA4AF" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="60" y1="162" x2="60" y2="232" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="26" y="172" width="11" height="50" rx="2.5" fill="url(#goldStrip)"/>

    <!-- ================= 3D ZIPPER STRAP & CLASP ================= -->
    <g filter="url(#zipShadow)">
      <!-- Subtle V-open Zipper Tape at Top (y=20..90) -->
      <polygon points="95,20 119,20 128,80 137,20 161,20 153,90 103,90" fill="url(#zipTape)"/>
      <polygon points="119,20 137,20 128,80" fill="#022C22"/>

      <!-- Closed Vertical Zipper Tape (y=90..234) -->
      <rect x="103" y="90" width="50" height="144" rx="3" fill="url(#zipTape)"/>
      <!-- Warm stitched borders (like leather/fabric strap) -->
      <line x1="107" y1="24" x2="103" y2="88" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3.5 3"/>
      <line x1="149" y1="24" x2="153" y2="88" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3.5 3"/>
      <line x1="107" y1="92" x2="107" y2="230" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3.5 3"/>
      <line x1="149" y1="92" x2="149" y2="230" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3.5 3"/>

      <!-- Bottom Metal End-Stop -->
      <rect x="111" y="228" width="34" height="5" rx="1.8" fill="url(#steelTooth)"/>

      <!-- Precision Interlocking Steel Teeth -->
      <g fill="url(#steelTooth)">
        <rect x="102" y="25" width="13" height="5" rx="1.6" transform="rotate(-7 108.5 27.5)"/>
        <rect x="104" y="38" width="13" height="5" rx="1.6" transform="rotate(-7 110.5 40.5)"/>
        <rect x="106" y="51" width="13" height="5" rx="1.6" transform="rotate(-7 112.5 53.5)"/>
        <rect x="108" y="64" width="13" height="5" rx="1.6" transform="rotate(-7 114.5 66.5)"/>

        <rect x="141" y="25" width="13" height="5" rx="1.6" transform="rotate(7 147.5 27.5)"/>
        <rect x="139" y="38" width="13" height="5" rx="1.6" transform="rotate(7 145.5 40.5)"/>
        <rect x="137" y="51" width="13" height="5" rx="1.6" transform="rotate(7 143.5 53.5)"/>
        <rect x="135" y="64" width="13" height="5" rx="1.6" transform="rotate(7 141.5 66.5)"/>

        <rect x="113" y="182" width="14" height="5.5" rx="1.8"/>
        <rect x="129" y="191" width="14" height="5.5" rx="1.8"/>
        <rect x="113" y="200" width="14" height="5.5" rx="1.8"/>
        <rect x="129" y="209" width="14" height="5.5" rx="1.8"/>
        <rect x="113" y="218" width="14" height="5.5" rx="1.8"/>
      </g>

      <!-- Heavy 3D Brushed Steel Zipper Slider & Gold-Embossed "Z" Pull-Tab -->
      <path d="M98 85 C98 81 101 78 105 78 H151 C155 78 158 81 158 85 L153 108 C152 112 149 114 145 114 H111 C107 114 104 112 103 108 Z"
            fill="url(#steelBody)" stroke="#334155" stroke-width="1.8"/>
      <rect x="118" y="92" width="20" height="14" rx="3.5" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <rect x="123" y="103" width="10" height="13" rx="3" fill="url(#steelBody)"/>

      <!-- Brushed Steel Pull-Tab with Gold "Z" -->
      <rect x="102" y="115" width="52" height="58" rx="11" fill="#1E293B" stroke="url(#steelBody)" stroke-width="4"/>
      <path d="M115 131 H141 L115 157 H141"
            fill="none" stroke="url(#goldStrip)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
