<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) 3D Book-Belt Icon">
  <defs>
    <!-- Classic RAR-style 3D Cylindrical Book Spines (Top: Ruby-Magenta, Mid: Royal-Blue, Bot: Emerald-Green) -->
    <linearGradient id="bookTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E11D48"/>
      <stop offset="10%"  stop-color="#FB7185"/>
      <stop offset="28%"  stop-color="#E11D48"/>
      <stop offset="72%"  stop-color="#BE123C"/>
      <stop offset="92%"  stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <linearGradient id="bookMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="10%"  stop-color="#818CF8"/>
      <stop offset="28%"  stop-color="#4F46E5"/>
      <stop offset="72%"  stop-color="#3730A3"/>
      <stop offset="92%"  stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="bookBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#16A34A"/>
      <stop offset="10%"  stop-color="#4ADE80"/>
      <stop offset="28%"  stop-color="#22C55E"/>
      <stop offset="72%"  stop-color="#15803D"/>
      <stop offset="92%"  stop-color="#166534"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>

    <!-- Left/Right Cylindrical Spine Wrap Shading -->
    <linearGradient id="cylWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="6%"   stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="16%"  stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="84%"  stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="94%"  stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Brushed Silver-Gold Spine Label Strip -->
    <linearGradient id="spineStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="25%"  stop-color="#F59E0B"/>
      <stop offset="75%"  stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Warm Gold-Tan Leather Belt (classic RAR look) -->
    <linearGradient id="leatherBelt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="14%"  stop-color="#F59E0B"/>
      <stop offset="50%"  stop-color="#D97706"/>
      <stop offset="88%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="leatherLoop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#92400E"/>
      <stop offset="25%"  stop-color="#D97706"/>
      <stop offset="50%"  stop-color="#F59E0B"/>
      <stop offset="75%"  stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- 3D Brushed Steel U-Buckle & Prong -->
    <linearGradient id="buckleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F1F5F9"/>
      <stop offset="25%"  stop-color="#CBD5E1"/>
      <stop offset="65%"  stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="prongMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#64748B"/>
      <stop offset="45%"  stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="bookShadow" x="-8%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="beltShadow" x="-22%" y="-6%" width="144%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
    <filter id="buckleShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
  </defs>

  <g filter="url(#bookShadow)">
    <!-- ================= TOP BOOK (Emerald) ================= -->
    <rect x="10" y="22" width="236" height="70" rx="11" fill="url(#bookTop)"/>
    <rect x="10" y="22" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <line x1="52" y1="22" x2="52" y2="92" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="22" x2="54" y2="92" stroke="#6EE7B7" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="60" y1="22" x2="60" y2="92" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="26" y="32" width="11" height="50" rx="2.5" fill="url(#spineStrip)"/>

    <!-- ================= MIDDLE BOOK (Amber-Gold) ================= -->
    <rect x="10" y="92" width="236" height="70" rx="11" fill="url(#bookMid)"/>
    <rect x="10" y="92" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <rect x="10" y="92" width="236" height="3" fill="#000000" fill-opacity="0.35"/>
    <line x1="52" y1="92" x2="52" y2="162" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="92" x2="54" y2="162" stroke="#FEF08A" stroke-opacity="0.30" stroke-width="1.2"/>
    <line x1="60" y1="92" x2="60" y2="162" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="26" y="102" width="11" height="50" rx="2.5" fill="url(#spineStrip)"/>

    <!-- ================= BOTTOM BOOK (Coral-Crimson) ================= -->
    <rect x="10" y="162" width="236" height="70" rx="11" fill="url(#bookBot)"/>
    <rect x="10" y="162" width="236" height="70" rx="11" fill="url(#cylWrap)"/>
    <rect x="10" y="162" width="236" height="3" fill="#000000" fill-opacity="0.35"/>
    <line x1="52" y1="162" x2="52" y2="232" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
    <line x1="54" y1="162" x2="54" y2="232" stroke="#FDA4AF" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="60" y1="162" x2="60" y2="232" stroke="#000000" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="26" y="172" width="11" height="50" rx="2.5" fill="url(#spineStrip)"/>

    <!-- ================= WINRAR-STYLE 3D BELT & BUCKLE ================= -->
    <g filter="url(#beltShadow)">
      <!-- Main Vertical Leather Belt Strap -->
      <rect x="97" y="18" width="62" height="218" rx="6" fill="url(#leatherBelt)" stroke="#020617" stroke-opacity="0.45" stroke-width="1.5"/>

      <!-- Left & Right Golden Stitched Seams -->
      <line x1="103" y1="24" x2="103" y2="230" stroke="#F59E0B" stroke-opacity="0.85" stroke-width="1.6" stroke-dasharray="3.5 3"/>
      <line x1="153" y1="24" x2="153" y2="230" stroke="#F59E0B" stroke-opacity="0.85" stroke-width="1.6" stroke-dasharray="3.5 3"/>

      <!-- Rounded Leather Belt Tip (Top) -->
      <path d="M101 66 V46 C101 31 113 22 128 22 C143 22 155 31 155 46 V66 Z"
            fill="url(#leatherBelt)" stroke="#020617" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M107 64 V47 C107 35 116 28 128 28 C140 28 149 35 149 47 V64"
            fill="none" stroke="#F59E0B" stroke-opacity="0.85" stroke-width="1.5" stroke-dasharray="3.5 3"/>

      <!-- Horizontal Leather Keeper Loop -->
      <rect x="95" y="65" width="66" height="16" rx="3.5" fill="url(#leatherLoop)" stroke="#020617" stroke-opacity="0.55" stroke-width="1.5"/>

      <!-- Belt Punch Hole -->
      <circle cx="128" cy="95" r="5" fill="#020617" stroke="#475569" stroke-width="1.2"/>

      <!-- 3D Brushed Steel U-Buckle -->
      <g filter="url(#buckleShadow)">
        <!-- Outer U-Frame -->
        <path d="M90 105 C90 100 94 97 99 97 H157 C162 97 166 100 166 105 V148 C166 158 158 165 148 165 H108 C98 165 90 158 90 148 Z
                 M103 109 V146 C103 150 106 153 110 153 H146 C150 153 153 150 153 146 V109 Z"
              fill="url(#buckleMetal)" fill-rule="evenodd" stroke="#334155" stroke-width="1.5"/>

        <!-- Center Buckle Prong / Tongue -->
        <path d="M123 130 C123 127 125 125 128 125 C131 125 133 127 133 130 L132 158 C132 160 130 162 128 162 C126 162 124 160 124 158 Z"
              fill="url(#prongMetal)" stroke="#334155" stroke-width="1.2"/>
      </g>
    </g>
  </g>
</svg>
