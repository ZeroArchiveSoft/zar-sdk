<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) Icon">
  <defs>
    <!-- High-contrast primary-inspired vivid colors (Sky-Blue -> Gold-Yellow -> Coral-Red) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="midFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="botFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="zipMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="iconShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="pullShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed geometry (x=14..242, y=18..238) for crisp 16px-256px Windows icons -->
  <g filter="url(#iconShadow)">
    <!-- Bottom Coral-Red Slab (y=162..236) -->
    <rect x="14" y="168" width="228" height="68" rx="16" fill="#9F1239"/>
    <rect x="14" y="162" width="228" height="64" rx="16" fill="url(#botFace)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

    <!-- Middle Vivid-Gold Slab (y=90..164) -->
    <rect x="14" y="96" width="228" height="68" rx="16" fill="#A16207"/>
    <rect x="14" y="90" width="228" height="64" rx="16" fill="url(#midFace)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Top Sky-Blue Slab (y=18..92) -->
    <rect x="14" y="24" width="228" height="68" rx="16" fill="#0369A1"/>
    <rect x="14" y="18" width="228" height="64" rx="16" fill="url(#topFace)" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2"/>

    <!-- Subtle V-open Zipper Backing at Top (y=18..90) -->
    <polygon points="94,18 118,18 128,78 138,18 162,18 153,90 103,90" fill="#0F172A" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="118,18 138,18 128,78" fill="#0369A1"/>

    <!-- Closed Vertical Zipper Backing Below Slider (y=90..236) -->
    <rect x="103" y="90" width="50" height="146" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>

    <!-- Bottom Metal Zipper End-Stop -->
    <rect x="109" y="229" width="38" height="6" rx="2" fill="url(#zipMetal)"/>

    <!-- Bold Interlocking Zipper Teeth (high contrast for small icons) -->
    <g fill="url(#zipMetal)">
      <!-- Subtle angled top teeth (7 deg) -->
      <rect x="101" y="24" width="14" height="6" rx="2" transform="rotate(-7 108 27)"/>
      <rect x="103" y="37" width="14" height="6" rx="2" transform="rotate(-7 110 40)"/>
      <rect x="105" y="50" width="14" height="6" rx="2" transform="rotate(-7 112 53)"/>
      <rect x="107" y="63" width="14" height="6" rx="2" transform="rotate(-7 114 66)"/>

      <rect x="141" y="24" width="14" height="6" rx="2" transform="rotate(7 148 27)"/>
      <rect x="139" y="37" width="14" height="6" rx="2" transform="rotate(7 146 40)"/>
      <rect x="137" y="50" width="14" height="6" rx="2" transform="rotate(7 144 53)"/>
      <rect x="135" y="63" width="14" height="6" rx="2" transform="rotate(7 142 66)"/>

      <!-- Closed interlocking teeth below pull-tab (y=184..225) -->
      <rect x="111" y="185" width="16" height="6.5" rx="2"/>
      <rect x="129" y="194" width="16" height="6.5" rx="2"/>
      <rect x="111" y="203" width="16" height="6.5" rx="2"/>
      <rect x="129" y="212" width="16" height="6.5" rx="2"/>
      <rect x="111" y="220" width="16" height="6.5" rx="2"/>
    </g>

    <!-- Bold Zipper Slider & "Z" Pull-Tab -->
    <g filter="url(#pullShadow)">
      <path d="M98 84 C98 80 101 77 105 77 H151 C155 77 158 80 158 84 L153 108 C152 112 149 114 145 114 H111 C107 114 104 112 103 108 Z"
            fill="url(#zipMetal)" stroke="#334155" stroke-width="2.5"/>
      <rect x="118" y="92" width="20" height="15" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
      <rect x="123" y="104" width="10" height="14" rx="3" fill="url(#zipMetal)"/>

      <!-- Large High-Contrast "Z" Pull-Tab -->
      <rect x="99" y="116" width="58" height="62" rx="12" fill="#0F172A" stroke="url(#zipMetal)" stroke-width="4.5"/>
      <path d="M114 132 H142 L114 162 H142"
            fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
