<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) Studio 3D Icon">
  <defs>
    <!-- Deep, Candy-Glossy 3D Book Spines (No chalky/pastel highlights) -->
    <!-- Top: Deep Ocean-Teal / Emerald -->
    <linearGradient id="book1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="10%" stop-color="#14B8A6"/>
      <stop offset="42%" stop-color="#0D9488"/>
      <stop offset="82%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Middle: Rich Sunset-Orange / Amber -->
    <linearGradient id="book2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="10%" stop-color="#F59E0B"/>
      <stop offset="42%" stop-color="#D97706"/>
      <stop offset="82%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Bottom: Deep Electric-Indigo / Cobalt -->
    <linearGradient id="book3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="10%" stop-color="#6366F1"/>
      <stop offset="42%" stop-color="#4F46E5"/>
      <stop offset="82%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Cylindrical 3D Horizontal Wrap Shading -->
    <linearGradient id="sideWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="6%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="14%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="86%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="94%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.48"/>
    </linearGradient>

    <!-- Specular Glossy Top Sheen per Book -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gold Foil Spine Bookmark -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Sleek Gunmetal / Titanium Zipper Strap -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="18%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="82%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Brushed Chrome Buckle / Slider -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="bookDrop" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
    <filter id="strapDrop" x="-30%" y="-10%" width="160%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#bookDrop)">
    <!-- BOOK 3 (Bottom Indigo, y=162..230) -->
    <rect x="8" y="162" width="240" height="68" rx="14" fill="url(#book3)"/>
    <rect x="18" y="164" width="220" height="12" rx="6" fill="url(#topSheen)"/>
    <rect x="8" y="162" width="240" height="68" rx="14" fill="url(#sideWrap)"/>
    <line x1="46" y1="163" x2="46" y2="229" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="48" y1="163" x2="48" y2="229" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="210" y1="163" x2="210" y2="229" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="23" y="172" width="11" height="48" rx="2.5" fill="url(#goldFoil)" stroke="#451A03" stroke-opacity="0.35" stroke-width="1"/>

    <!-- BOOK 2 (Middle Amber-Orange, y=94..162) -->
    <rect x="8" y="94" width="240" height="68" rx="14" fill="url(#book2)"/>
    <rect x="18" y="96" width="220" height="12" rx="6" fill="url(#topSheen)"/>
    <rect x="8" y="94" width="240" height="68" rx="14" fill="url(#sideWrap)"/>
    <line x1="46" y1="95" x2="46" y2="161" stroke="#000000" stroke-opacity="0.26" stroke-width="2"/>
    <line x1="48" y1="95" x2="48" y2="161" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
    <line x1="210" y1="95" x2="210" y2="161" stroke="#000000" stroke-opacity="0.26" stroke-width="2"/>
    <rect x="23" y="104" width="11" height="48" rx="2.5" fill="url(#goldFoil)" stroke="#451A03" stroke-opacity="0.35" stroke-width="1"/>

    <!-- BOOK 1 (Top Ocean-Teal, y=26..94) -->
    <rect x="8" y="26" width="240" height="68" rx="14" fill="url(#book1)"/>
    <rect x="18" y="28" width="220" height="12" rx="6" fill="url(#topSheen)"/>
    <rect x="8" y="26" width="240" height="68" rx="14" fill="url(#sideWrap)"/>
    <line x1="46" y1="27" x2="46" y2="93" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="48" y1="27" x2="48" y2="93" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
    <line x1="210" y1="27" x2="210" y2="93" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="23" y="36" width="11" height="48" rx="2.5" fill="url(#goldFoil)" stroke="#451A03" stroke-opacity="0.35" stroke-width="1"/>

    <!-- SLEEK NARROWER 3D ZIPPER STRAP (width=40, x=108..148, wrapping tightly y=24..232) -->
    <g filter="url(#strapDrop)">
      <!-- Wrap-around gunmetal zipper band -->
      <rect x="108" y="24" width="40" height="208" rx="5" fill="url(#strapGrad)" stroke="#0F172A" stroke-width="1.5"/>
      <!-- Top & Bottom wrap highlights -->
      <rect x="109" y="25" width="38" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="109" y="227" width="38" height="4" rx="2" fill="#000000" fill-opacity="0.45"/>

      <!-- Fine stitched edges -->
      <line x1="112" y1="30" x2="112" y2="226" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="144" y1="30" x2="144" y2="226" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3"/>

      <!-- Recessed center zipper channel -->
      <rect x="119" y="26" width="18" height="202" rx="2" fill="#090D16"/>

      <!-- Crisp Metallic Zipper Teeth (Top y=30..72 & Bottom y=172..222) -->
      <g fill="url(#chromeMetal)">
        <rect x="119" y="31" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="37" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="43" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="49" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="55" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="61" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="67" width="9" height="4.5" rx="1.5"/>

        <rect x="119" y="176" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="182" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="188" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="194" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="200" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="206" width="9" height="4.5" rx="1.5"/>
        <rect x="119" y="212" width="9" height="4.5" rx="1.5"/>
        <rect x="128" y="218" width="9" height="4.5" rx="1.5"/>
      </g>

      <!-- Sleek 3D Chrome Zipper Slider Head -->
      <path d="M105 78 C105 74 108 71 112 71 H144 C148 71 151 74 151 78 L147 104 C146 108 143 110 139 110 H117 C113 110 110 108 109 104 Z"
            fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.8"/>
      <rect x="121" y="84" width="14" height="11" rx="3" fill="#0F172A"/>

      <!-- Sleek Metallic Pull-Tab with Gold "Z" -->
      <rect x="110" y="108" width="36" height="58" rx="9" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.8"/>
      <rect x="114" y="112" width="28" height="50" rx="6" fill="#0F172A"/>
      <path d="M120 126 H136 L120 148 H136"
            fill="none" stroke="url(#goldFoil)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
