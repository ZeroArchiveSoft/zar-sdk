<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) 3D Icon">
  <defs>
    <!-- Top Emerald-Green 3D Volume -->
    <linearGradient id="topTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="topFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Middle Gold-Amber 3D Volume -->
    <linearGradient id="midFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Bottom Coral-Crimson 3D Volume -->
    <linearGradient id="botFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- 3D Side Pages / Compressed Layers Edge -->
    <linearGradient id="sideEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Brushed Titanium Zipper Metal -->
    <linearGradient id="zipMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <filter id="drop3d" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <filter id="pull3d" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#drop3d)">
    <!-- ================= BOTTOM 3D VOLUME (Coral-Red) ================= -->
    <!-- Side depth / compressed pages -->
    <path d="M188,162 L236,144 L236,204 L188,230 Z" fill="url(#sideEdge)" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="192" y1="176" x2="233" y2="159" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="192" y1="192" x2="233" y2="175" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="192" y1="208" x2="233" y2="191" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Front face -->
    <path d="M22,158 C22,152 27,148 33,150 L188,164 L188,230 L33,214 C27,212 22,206 22,200 Z"
          fill="url(#botFront)" stroke="#881337" stroke-width="2" stroke-linejoin="round"/>
    <!-- Gloss highlight -->
    <path d="M28,156 L182,170 L182,180 L28,166 Z" fill="#FFFFFF" fill-opacity="0.22"/>

    <!-- ================= MIDDLE 3D VOLUME (Gold-Yellow) ================= -->
    <!-- Side depth / compressed pages -->
    <path d="M188,96 L236,78 L236,140 L188,164 Z" fill="url(#sideEdge)" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="192" y1="112" x2="233" y2="95" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="192" y1="128" x2="233" y2="111" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="192" y1="144" x2="233" y2="127" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Front face -->
    <path d="M22,92 C22,86 27,82 33,84 L188,98 L188,164 L33,148 C27,146 22,140 22,134 Z"
          fill="url(#midFront)" stroke="#92400E" stroke-width="2" stroke-linejoin="round"/>
    <!-- Gloss highlight -->
    <path d="M28,90 L182,104 L182,114 L28,100 Z" fill="#FFFFFF" fill-opacity="0.28"/>

    <!-- ================= TOP 3D VOLUME (Emerald-Green) ================= -->
    <!-- Top 3D surface -->
    <path d="M22,40 L78,18 L236,30 L188,52 Z" fill="url(#topTop)" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
    <!-- Side depth / compressed pages -->
    <path d="M188,52 L236,30 L236,78 L188,98 Z" fill="url(#sideEdge)" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="192" y1="64" x2="233" y2="46" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="192" y1="78" x2="233" y2="60" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Front face -->
    <path d="M22,40 L188,52 L188,98 L33,84 C27,82 22,76 22,70 Z"
          fill="url(#topFront)" stroke="#065F46" stroke-width="2" stroke-linejoin="round"/>
    <!-- Gloss highlight -->
    <path d="M28,45 L182,56 L182,66 L28,55 Z" fill="#FFFFFF" fill-opacity="0.26"/>

    <!-- ================= 3D WRAP-AROUND ZIPPER ================= -->
    <!-- Top-perspective zipper band wrapping over top face -->
    <polygon points="94,24 134,27 124,48 84,45" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <!-- Slight V-open slit at front-top -->
    <polygon points="84,45 124,48 124,96 84,93" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="98,46 112,47 105,86" fill="#047857"/>

    <!-- Closed Vertical Zipper Track on front spine (y=93..223) -->
    <polygon points="84,93 124,96 124,224 84,220" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <!-- Bottom metal stop -->
    <polygon points="89,215 119,218 119,223 89,220" fill="url(#zipMetal)"/>

    <!-- Interlocking Zipper Teeth -->
    <g fill="url(#zipMetal)">
      <!-- Top perspective teeth -->
      <rect x="97" y="29" width="11" height="4.5" rx="1.5" transform="rotate(5 102 31)"/>
      <rect x="110" y="34" width="11" height="4.5" rx="1.5" transform="rotate(5 115 36)"/>
      <rect x="93" y="37" width="11" height="4.5" rx="1.5" transform="rotate(5 98 39)"/>

      <!-- Slight V-open teeth -->
      <rect x="88" y="51" width="11" height="5" rx="1.5" transform="rotate(-5 93 53)"/>
      <rect x="89" y="62" width="11" height="5" rx="1.5" transform="rotate(-5 94 64)"/>
      <rect x="90" y="73" width="11" height="5" rx="1.5" transform="rotate(-5 95 75)"/>

      <rect x="110" y="53" width="11" height="5" rx="1.5" transform="rotate(10 115 55)"/>
      <rect x="109" y="64" width="11" height="5" rx="1.5" transform="rotate(10 114 66)"/>
      <rect x="108" y="75" width="11" height="5" rx="1.5" transform="rotate(10 113 77)"/>

      <!-- Closed teeth below pull-tab (y=174..212) -->
      <rect x="90" y="176" width="13" height="5.5" rx="1.5"/>
      <rect x="105" y="184" width="13" height="5.5" rx="1.5"/>
      <rect x="90" y="191" width="13" height="5.5" rx="1.5"/>
      <rect x="105" y="199" width="13" height="5.5" rx="1.5"/>
      <rect x="90" y="206" width="13" height="5.5" rx="1.5"/>
    </g>

    <!-- 3D Metallic Zipper Slider & "Z" Pull-Tab -->
    <g filter="url(#pull3d)">
      <path d="M80,88 C80,84 83,81 87,82 L123,85 C127,85 130,89 130,93 L126,113 C125,117 122,119 118,119 L90,116 C86,116 83,113 82,109 Z"
            fill="url(#zipMetal)" stroke="#334155" stroke-width="2"/>
      <rect x="96" y="96" width="16" height="13" rx="3.5" fill="#0F172A" stroke="#64748B" stroke-width="1.8"/>
      <rect x="100" y="106" width="8" height="12" rx="3" fill="url(#zipMetal)"/>

      <!-- Chunky "Z" Pull-Tab -->
      <rect x="81" y="117" width="46" height="52" rx="10" fill="#0F172A" stroke="url(#zipMetal)" stroke-width="4"/>
      <path d="M93,131 H115 L93,155 H115"
            fill="none" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
