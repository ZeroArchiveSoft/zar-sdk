<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) Realistic 3D Archive Icon">
  <defs>
    <!-- Cylindrical 3D Book Spine Shading: Top Emerald-Green -->
    <linearGradient id="bookTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="14%" stop-color="#34D399"/>
      <stop offset="48%" stop-color="#10B981"/>
      <stop offset="84%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Cylindrical 3D Book Spine Shading: Middle Sunset-Gold -->
    <linearGradient id="bookMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="14%" stop-color="#FDE047"/>
      <stop offset="48%" stop-color="#F59E0B"/>
      <stop offset="84%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Cylindrical 3D Book Spine Shading: Bottom Coral-Crimson -->
    <linearGradient id="bookBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="14%" stop-color="#FB7185"/>
      <stop offset="48%" stop-color="#E11D48"/>
      <stop offset="84%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Subtle horizontal edge vignette for cylindrical wrap -->
    <linearGradient id="sideVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="93%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>

    <!-- Brushed Silver Spine Label Plate -->
    <linearGradient id="spinePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Zipper Backing & Brushed Titanium Metal -->
    <linearGradient id="zipTape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="20%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="zipMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="sliderBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="drop" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="beltShadow" x="-25%" y="-8%" width="150%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <!-- ================= TOP BOOK (Emerald-Green) ================= -->
    <rect x="12" y="20" width="232" height="72" rx="14" fill="url(#bookTop)"/>
    <rect x="12" y="20" width="232" height="72" rx="14" fill="url(#sideVignette)"/>
    <!-- Spine crease grooves -->
    <line x1="56" y1="22" x2="56" y2="90" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="58" y1="22" x2="58" y2="90" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Left spine metallic plate -->
    <rect x="30" y="31" width="12" height="50" rx="3" fill="url(#spinePlate)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- ================= MIDDLE BOOK (Sunset-Gold) ================= -->
    <rect x="12" y="92" width="232" height="72" rx="14" fill="url(#bookMid)"/>
    <rect x="12" y="92" width="232" height="72" rx="14" fill="url(#sideVignette)"/>
    <line x1="56" y1="94" x2="56" y2="162" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="58" y1="94" x2="58" y2="162" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="30" y="103" width="12" height="50" rx="3" fill="url(#spinePlate)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- ================= BOTTOM BOOK (Coral-Crimson) ================= -->
    <rect x="12" y="164" width="232" height="72" rx="14" fill="url(#bookBot)"/>
    <rect x="12" y="164" width="232" height="72" rx="14" fill="url(#sideVignette)"/>
    <line x1="56" y1="166" x2="56" y2="234" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="58" y1="166" x2="58" y2="234" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="30" y="175" width="12" height="50" rx="3" fill="url(#spinePlate)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- ================= REALISTIC 3D ZIPPER WRAP ================= -->
    <g filter="url(#beltShadow)">
      <!-- Subtle V-open Zipper Tape at Top (flush at y=20..90) -->
      <polygon points="94,20 119,20 128,78 137,20 162,20 153,90 103,90" fill="url(#zipTape)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="119,20 137,20 128,78" fill="#064E3B"/>

      <!-- Closed Vertical Zipper Tape (flush at y=90..236) -->
      <rect x="103" y="90" width="50" height="146" rx="3" fill="url(#zipTape)" stroke="#334155" stroke-width="1.5"/>
      <!-- Outer stitched seams (completely clear of zipper teeth) -->
      <line x1="98"  y1="23" x2="106" y2="86" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3.5 3"/>
      <line x1="158" y1="23" x2="150" y2="86" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3.5 3"/>
      <line x1="107" y1="93" x2="107" y2="232" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3.5 3"/>
      <line x1="149" y1="93" x2="149" y2="232" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3.5 3"/>

      <!-- Bottom Metal Stop -->
      <rect x="110" y="230" width="36" height="5" rx="2" fill="url(#zipMetal)"/>

      <!-- Interlocking Metallic Teeth (aligned to inner V-edges, clear of stitching) -->
      <g fill="url(#zipMetal)">
        <rect x="108" y="24" width="13" height="5.5" rx="1.8" transform="rotate(-8 114.5 26.75)"/>
        <rect x="110" y="37" width="13" height="5.5" rx="1.8" transform="rotate(-8 116.5 39.75)"/>
        <rect x="112" y="50" width="13" height="5.5" rx="1.8" transform="rotate(-8 118.5 52.75)"/>
        <rect x="114" y="63" width="13" height="5.5" rx="1.8" transform="rotate(-8 120.5 65.75)"/>

        <rect x="135" y="24" width="13" height="5.5" rx="1.8" transform="rotate(8 141.5 26.75)"/>
        <rect x="133" y="37" width="13" height="5.5" rx="1.8" transform="rotate(8 139.5 39.75)"/>
        <rect x="131" y="50" width="13" height="5.5" rx="1.8" transform="rotate(8 137.5 52.75)"/>
        <rect x="129" y="63" width="13" height="5.5" rx="1.8" transform="rotate(8 135.5 65.75)"/>

        <rect x="113" y="185" width="14" height="6" rx="2"/>
        <rect x="129" y="194" width="14" height="6" rx="2"/>
        <rect x="113" y="203" width="14" height="6" rx="2"/>
        <rect x="129" y="212" width="14" height="6" rx="2"/>
        <rect x="113" y="221" width="14" height="6" rx="2"/>
      </g>

      <!-- Sculpted 3D Metallic Slider & "Z" Pull-Tab -->
      <path d="M97 84 C97 79 100 76 105 76 H151 C156 76 159 79 159 84 L154 109 C153 113 150 115 145 115 H111 C106 115 103 113 102 109 Z"
            fill="url(#sliderBody)" stroke="#334155" stroke-width="2"/>
      <rect x="118" y="92" width="20" height="15" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1.8"/>
      <rect x="123" y="104" width="10" height="14" rx="3" fill="url(#zipMetal)"/>

      <rect x="99" y="116" width="58" height="62" rx="12" fill="#0F172A" stroke="url(#zipMetal)" stroke-width="4"/>
      <path d="M114 132 H142 L114 162 H142"
            fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
