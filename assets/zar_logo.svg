<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ZeroArchive (.zar) 3D Icon">
  <defs>
    <!-- 3D Cylindrical Book-Spine Vertical Lighting (Top -> Middle -> Bottom) -->
    <!-- Top Book: Rich Emerald-Teal -->
    <linearGradient id="book1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="14%" stop-color="#34D399"/>
      <stop offset="48%" stop-color="#059669"/>
      <stop offset="86%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Middle Book: Rich Amber-Gold -->
    <linearGradient id="book2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="14%" stop-color="#FACC15"/>
      <stop offset="48%" stop-color="#EAB308"/>
      <stop offset="86%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <!-- Bottom Book: Rich Coral-Crimson -->
    <linearGradient id="book3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="14%" stop-color="#FB7185"/>
      <stop offset="48%" stop-color="#E11D48"/>
      <stop offset="86%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Cylindrical Left/Right Edge Shading -->
    <linearGradient id="sideCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="16%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="84%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="93%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Left Foil Spine Label Strip -->
    <linearGradient id="foilStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Brushed Chrome/Titanium Zipper Metal -->
    <linearGradient id="chromeH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Cast shadow behind zipper & icon -->
    <filter id="drop" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="zipShadow" x="-25%" y="-10%" width="150%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <!-- BOOK 3 (Bottom Coral-Crimson, y=162..230) -->
    <rect x="8" y="162" width="240" height="68" rx="14" fill="url(#book3)"/>
    <rect x="8" y="162" width="240" height="68" rx="14" fill="url(#sideCurve)"/>
    <!-- Spine rib grooves -->
    <line x1="48" y1="163" x2="48" y2="229" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="50" y1="163" x2="50" y2="229" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>
    <line x1="208" y1="163" x2="208" y2="229" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>
    <!-- Left foil spine tab -->
    <rect x="24" y="172" width="12" height="48" rx="3" fill="url(#foilStrip)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- BOOK 2 (Middle Amber-Gold, y=94..162) -->
    <rect x="8" y="94" width="240" height="68" rx="14" fill="url(#book2)"/>
    <rect x="8" y="94" width="240" height="68" rx="14" fill="url(#sideCurve)"/>
    <line x1="48" y1="95" x2="48" y2="161" stroke="#000000" stroke-opacity="0.20" stroke-width="2"/>
    <line x1="50" y1="95" x2="50" y2="161" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="208" y1="95" x2="208" y2="161" stroke="#000000" stroke-opacity="0.20" stroke-width="2"/>
    <rect x="24" y="104" width="12" height="48" rx="3" fill="url(#foilStrip)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- BOOK 1 (Top Emerald-Teal, y=26..94) -->
    <rect x="8" y="26" width="240" height="68" rx="14" fill="url(#book1)"/>
    <rect x="8" y="26" width="240" height="68" rx="14" fill="url(#sideCurve)"/>
    <line x1="48" y1="27" x2="48" y2="93" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="50" y1="27" x2="50" y2="93" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="208" y1="27" x2="208" y2="93" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="24" y="36" width="12" height="48" rx="3" fill="url(#foilStrip)" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>

    <!-- 3D ZIPPER TRACK (Subtle V-open at top y=24..88, closed y=88..232) -->
    <g filter="url(#zipShadow)">
      <!-- Top slight V-open zipper tape -->
      <polygon points="94,24 118,24 128,82 138,24 162,24 154,90 102,90" fill="#1E293B" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="118,24 138,24 128,82" fill="#064E3B"/>

      <!-- Closed vertical zipper tape -->
      <rect x="102" y="88" width="52" height="144" rx="5" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
      <!-- Stitched seams -->
      <line x1="107" y1="92" x2="107" y2="228" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="149" y1="92" x2="149" y2="228" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Bottom metal end-stop -->
      <rect x="110" y="225" width="36" height="6" rx="2" fill="url(#chromeV)"/>

      <!-- 3D Chrome Interlocking Teeth -->
      <g fill="url(#chromeH)" stroke="#334155" stroke-width="0.6">
        <!-- Upper subtle V teeth -->
        <rect x="102" y="30" width="14" height="6" rx="2" transform="rotate(-7 109 33)"/>
        <rect x="104" y="42" width="14" height="6" rx="2" transform="rotate(-7 111 45)"/>
        <rect x="106" y="54" width="14" height="6" rx="2" transform="rotate(-7 113 57)"/>
        <rect x="108" y="66" width="14" height="6" rx="2" transform="rotate(-7 115 69)"/>

        <rect x="140" y="30" width="14" height="6" rx="2" transform="rotate(7 147 33)"/>
        <rect x="138" y="42" width="14" height="6" rx="2" transform="rotate(7 145 45)"/>
        <rect x="136" y="54" width="14" height="6" rx="2" transform="rotate(7 143 57)"/>
        <rect x="134" y="66" width="14" height="6" rx="2" transform="rotate(7 141 69)"/>

        <!-- Lower closed interlocking teeth -->
        <rect x="111" y="182" width="16" height="6.5" rx="2"/>
        <rect x="129" y="190" width="16" height="6.5" rx="2"/>
        <rect x="111" y="198" width="16" height="6.5" rx="2"/>
        <rect x="129" y="206" width="16" height="6.5" rx="2"/>
        <rect x="111" y="214" width="16" height="6.5" rx="2"/>
      </g>

      <!-- 3D Chrome Zipper Slider -->
      <path d="M97 82 C97 78 100 75 104 75 H152 C156 75 159 78 159 82 L154 108 C153 112 150 114 146 114 H110 C106 114 103 112 102 108 Z"
            fill="url(#chromeV)" stroke="#334155" stroke-width="2"/>
      <rect x="118" y="91" width="20" height="14" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="123" y="102" width="10" height="14" rx="3" fill="url(#chromeH)"/>

      <!-- 3D "Z" Pull-Tab -->
      <rect x="99" y="114" width="58" height="62" rx="12" fill="#0F172A" stroke="url(#chromeV)" stroke-width="4.5"/>
      <path d="M114 130 H142 L114 160 H142"
            fill="none" stroke="#FACC15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
